name: "Lock inactive issues and pull requests"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 * * * *"
    workflow_dispatch: # yamllint disable-line rule:empty-values

permissions:
    contents: "read" # to read the repository
    discussions: "write" # for dessant/lock-threads to lock inactive discussions
    issues: "write" # for the shared workflow to comment on and label issues
    pull-requests: "write" # for the shared workflow to comment on and label pull requests

jobs:
    lock-closed:
        uses: "anolilab/workflows/.github/workflows/lock-closed.yml@b7c2014dc8b1f022a340111874e6c13346e17598" # main
        with:
            target-repo: "anolilab/ai-models"
