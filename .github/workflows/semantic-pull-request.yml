name: "Semantic Pull Request"

on: # yamllint disable-line rule:truthy
    pull_request_target:
        types:
            - "opened"
            - "reopened"
            - "edited"
            - "synchronize"
    merge_group: # yamllint disable-line rule:empty-values

permissions:
    contents: "read" # to read the repository
    pull-requests: "write" # for the shared workflow to comment on and label pull requests
    statuses: "write" # to mark the status of the analysed pull request

jobs:
    stale-issues:
        uses: "anolilab/workflows/.github/workflows/semantic-pull-request.yml@b7c2014dc8b1f022a340111874e6c13346e17598" # main
        with:
            target-repo: "anolilab/ai-models"
